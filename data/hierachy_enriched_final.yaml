categories:
- children:
  - description: Precision-ground steel shafts engineered for smooth, repeatable linear motion in ball
      bearing systems. Chrome-plated hardened steel and stainless variants withstand corrosive environments,
      while diameter range 8-25mm accommodates light to heavy-load automation applications. Surface finishes
      achieve <0.8µm Ra for minimal friction and bearing wear.
    example_user_queries:
    - What shaft diameters and material options (hardened steel, stainless, chrome-plated) are available?
    - Can you provide shafts with surface finish specifications under 0.8µm Ra?
    - What is the maximum runout tolerance for precision-ground shafts?
    - Do you offer shaft straightness guarantees for critical positioning applications?
    - What load capacities can different shaft diameters support in linear ball bearing systems?
    - Are custom lengths and end treatments (threaded, grooved) available for linear shafts?
    id: M0101000000
    name: Linear Shafts
    variant_parameters:
      outer_diameter_mm:
        description: Shaft outer diameter in millimetres
        example: What diameter shafts are available?
        type: continuous
        unit: mm
      length_mm:
        description: Overall shaft length in millimetres
        example: What lengths are stocked?
        type: continuous
        unit: mm
      material:
        description: Shaft material and surface treatment
        example: Are stainless steel or chrome-plated shafts available?
        type: enum
        values:
        - Carbon-Steel
        - Case-Hardened-Steel
        - Stainless-Steel
        - Chrome-Plated-Steel
        - Aluminum
      end_treatment:
        description: End machining style
        example: Can I get shafts with threaded or grooved ends?
        type: enum
        values:
        - Plain-Both-Ends
        - Chamfered-Both-Ends
        - Threaded-One-End
        - Threaded-Both-Ends
        - Grooved
  - description: Compact recirculating ball bearing blocks deliver low-friction precision positioning
      across multiple axes with sealed and unsealed variants. Ceramic and steel ball options support rated
      speeds from 2-8m/s, while extended preload configurations eliminate backlash in high-accuracy applications.
      Available in multiple material combinations including hardened steel blocks and stainless housings.
    example_user_queries:
    - What preload options (light, medium, heavy) and load capacities are available for LM series blocks?
    - Do you offer sealed, unsealed, or hybrid bearing configurations for different environments?
    - What are the maximum rated speeds for each bearing size and preload level?
    - Can ceramic-ball bearings be supplied for non-magnetic or high-precision applications?
    - What material combinations (steel/stainless/hybrid) are available for bearing blocks and retainers?
    - What is the typical maintenance and lubrication interval for sealed linear bearing blocks?
    id: M0104000000
    name: Linear Ball Bearings
    variant_parameters: &id001
      load_class:
        description: Optimized load capacity
        example: Which guides support heavy loads?
        type: enum
        values:
        - Light-Load
        - Standard-Load
        - Heavy-Load
        - Extra-Heavy-Load
      material:
        description: Material composition
        example: Are stainless guides available?
        type: enum
        values:
        - Steel
        - Stainless
        - Hardened-Steel
        - Coated
        - Ceramic
      precision_grade:
        description: Accuracy class per ISO 286/precision grade
        example: What precision grades are available?
        type: enum
        values:
        - H
        - P
        - N
        - Standard
      sealing_type:
        description: Environmental protection level
        example: Do you offer sealed variants?
        type: enum
        values:
        - None
        - Sealed
        - Full-Sealed
        - Cleanroom-Compatible
      speed_class:
        description: Optimized speed range
        example: Which guides support high-speed applications?
        type: enum
        values:
        - Low-Speed
        - Medium-Speed
        - High-Speed
  - children:
    - description: Slide bushings engineered with PTFE or polymer composite liners provide maintenance-free,
        low-friction linear motion without rolling elements. Flanged and unflanged metric/inch bore designs
        support moderate speeds and loads, with pre-finished options ready for immediate installation
        on standard shafts.
      example_user_queries:
      - What bore sizes and flange options (flanged, unflanged) are available?
      - What is the maximum PV rating and continuous load capacity per bushing type?
      - Do you offer PTFE, polymer-composite, or bronze-backed bushing variants?
      - What is the maximum continuous operating temperature for self-lubricating liners?
      - Can bushings be used directly with standard shafts without pre-treatment?
      - What installation clearance and tolerance specifications ensure optimal performance?
      id: M0107080000
      name: Plain & Self-Lubricating Bushings
      variant_parameters: *id001
    - description: Engineered PTFE or polymer-composite bar stock and tubing integrate lubrication for
        machining into custom bearing surfaces in space-constrained applications. Pre-finished and as-extruded
        options support light-to-moderate load handling at 0.3-0.8m/s speeds with minimal environmental
        maintenance.
      example_user_queries:
      - What standard stock sizes and cross-sections (round, square, rectangular) are available?
      - Can bar material be custom-machined to specific bearing profiles and surface finishes?
      - What is the PV rating and temperature operating range for polymer-composite bars?
      - Do you supply finished, semi-finished, or as-extruded stock for further machining?
      - What load capacity and speed capability can I expect from different material grades?
      - How should self-lubricating bar material be handled and stored to preserve properties?
      id: M0107070000
      name: Self-Lubricating Bars & Pipes
    - description: Axial load-bearing washers engineered in bronze, polymer-composite, or hybrid designs
        prevent friction and wear under rotational thrust loads. Sized for standard shaft and bearing
        combinations, they minimize system complexity while handling radial alignment and thrust distribution.
      example_user_queries:
      - What bore diameter, OD, and thickness options are available for thrust washers?
      - Do you offer bronze, polymer-composite, or hybrid material options for different speeds?
      - What is the maximum axial load and rated speed capability for each washer size?
      - Can washers be combined with standard shaft collars and bearing blocks?
      - What thickness tolerances and surface finishes are available for critical applications?
      - How should thrust washers be installed and positioned relative to adjacent components?
      id: M0107090000
      name: Thrust Washers
    description: Self-lubricating and plain bearing solutions deliver cost-effective linear motion without
      rolling elements, ideal for lower-speed applications with moderate load requirements. PTFE and polymer-composite
      materials provide dry-running operation with minimal maintenance across flanged and unflanged designs.
    example_user_queries:
    - What diameter and length options are available for plain bushings and thrust washers?
    - Can you supply PTFE, polymer-composite, or bronze-backed self-lubricating materials?
    - What are the typical PV (pressure-velocity) ratings and maximum load capacities?
    - What clearance specifications should be used for proper installation with standard shafts?
    - Do you offer both flanged and unflanged designs for different mounting configurations?
    - What is the recommended operating temperature range for self-lubricating materials?
    id: M0107000000
    name: Plain Bushings & Thrust Washers
  - children:
    - description: Rolling-element linear rail systems with precision blocks deliver repeatable positioning
        and moment-load handling for demanding automation applications. Hardened steel profiles with recirculating
        ball technology support <0.1mm repeatability, while sealed and unsealed variants adapt to diverse
        environmental conditions.
      example_user_queries:
      - What accuracy grades (H/P/N) and preload options suit zero-backlash automation?
      - What are the dynamic and static load ratings for different rail cross-section sizes?
      - What maximum travel distances and end-of-travel configurations are available?
      - Do you offer sealed bearing blocks or environmental protection for washdown applications?
      - What installation alignment tolerances and procedures ensure ±0.1mm repeatability?
      - What lubrication schedules and filtration levels are required for 10,000+ hour service life?
      id: M0110050000
      name: Standard Linear Guides
      variant_parameters: *id001
    - description: Compact linear guidance using cylindrical needle rollers enables space-efficient, high-load
        applications in stamping and die-casting machinery. Narrow guide profiles handle substantial radial
        and moment loads with 0.1-0.2mm repeatability and standard preload options for backlash-free positioning.
      example_user_queries:
      - What are the radial and moment load capacities compared to standard ball-bearing guides?
      - What is the minimum guide height and width for space-constrained die-casting applications?
      - What preload options reduce backlash while minimizing friction in high-speed applications?
      - Can needle roller guides be retrofit into existing linear rail mounting patterns?
      - What is the typical service life in terms of hours or stroke cycles?
      - Are sealed variants available for environments with metal chips or coolant mist?
      id: M0110060000
      name: Needle Roller Guides
      variant_parameters: *id001
    - description: Linear guide accessories including covers, seals, lubrication units, and limit switches
        extend performance and environmental protection of rolling-element rail systems. Modular attachment
        designs integrate into standard mounting patterns without requiring guide system redesign.
      example_user_queries:
      - What seal and cover types (bellows, accordion, full-length) are compatible with standard rails?
      - Do you offer integrated or external lubrication systems for different maintenance strategies?
      - What limit switch and proximity sensor options attach to linear rail carriages?
      - Can cable carriers and drag chains be mounted using standard guide accessories?
      - What guide length and end-block configurations support integrated cooling or spray protection?
      - Are quick-change mounting brackets available for tool changers on linear carriages?
      id: M0110040000
      name: Linear Guide Accessories
    - description: 'Specialized linear guide variants addressing unique positioning requirements

        beyond standard rolling-element rail applications. Includes reduced-profile blocks,

        customized materials for corrosive environments, and ultra-compact designs for

        space-constrained applications. Note: For guides handling moment loads (rotational),

        refer to M0110065000 (Moment-Load Linear Guides).'
      example_user_queries:
      - What non-standard guide profiles and cross-sections can you engineer for unique applications?
      - Do you offer ultra-compact blocks or reduced-height rail designs for space-constrained mounting?
      - Can linear guides be supplied in stainless, coated, or non-magnetic materials?
      - What customization is available for high-temperature or cryogenic applications?
      - Do you offer open-rail designs for applications requiring full enclosure flexibility?
      - What lead times and minimum quantities apply to customized guide variants?
      id: M0110030000
      name: Specialty Linear Guides
    - children:
      - description: Cross-roller linear guides engineered for combined linear and moment loads with cage
          alignment systems.
        id: M0110065100
        name: Cross-Roller Guides
      - description: Ultra-compact moment-load rail systems optimized for space-constrained applications.
        id: M0110065200
        name: Compact Moment-Load Rails
      description: 'Specialized linear guide systems engineered to handle combined linear positioning

        and rotational moment (angular) loads. Cross-roller configurations deliver high

        radial and moment load capacity in compact profiles, ideal for precision

        positioning and material handling applications requiring simultaneous X/Y/Z

        and rotational accuracy.'
      example_user_queries:
      - What linear and moment load capacities do cross-roller guides support?
      - What accuracy can moment-load guides achieve for simultaneous linear and rotational positioning?
      - Are sealed moment-load guide variants available for washdown environments?
      - How do moment-load guides compare to standard ball-bearing linear guides in terms of load capacity?
      - What is the maximum moment load (Nm) for different guide sizes?
      id: M0110065000
      name: Moment-Load Linear Guides
      variant_parameters: *id001
    description: Precision linear guidance systems deliver accurate, repeatable positioning across multiple
      axes using rolling-element rail technology. Ground hardened steel profiles with recirculating ball
      configurations achieve <0.1mm accuracy, while preload options eliminate backlash in zero-tolerance
      applications.
    example_user_queries:
    - What accuracy classes (H, P, N) and preload configurations are available?
    - What are the maximum load capacity and rated speed for different rail profile sizes?
    - What travel distances and mounting configurations (top, side, flange) do you offer?
    - Are sealed or unsealed bearing blocks available for dusty or wet environments?
    - What lubrication types and maintenance intervals are recommended for your rails?
    - Can multiple rails be synchronized for coordinated multi-axis positioning systems?
    id: M0110000000
    name: Linear Guides
  - children:
    - description: Single-axis screw-driven actuators convert rotary motor input to precision linear output
        with high efficiency and accuracy. Integrated ball screw or lead screw mechanisms support continuous
        duty across travel ranges, with electric motor or manual crank drive options for flexible application
        deployment.
      example_user_queries:
      - What travel ranges and stroke lengths are available for single-axis screw actuators?
      - What are the pushing/pulling force specifications and continuous duty ratings?
      - Do you offer electric motor-driven or manual hand-crank drive configurations?
      - What position feedback options (potentiometer, encoder, limit switches) are available?
      - What is the positioning repeatability and speed range for different screw types?
      - Can actuators be networked for synchronized multi-axis motion control?
      id: M0118020000
      name: Single Axis Actuators (Screw Driven)
    - description: Single-axis robot units deliver compact, integrated pick-and-place and positioning
        functionality with embedded control and motor drive. Ideal for space-constrained automation, these
        units combine actuator, motor, and controller in a unified package with standard mounting interfaces.
      example_user_queries:
      - What payload capacity and travel range does this single-axis robot provide?
      - What is the repeatability, speed range, and acceleration capability?
      - What standard interfaces (SCARA flange, vacuum ports, electromagnetic solenoid) are available?
      - What control options (stand-alone, networked, integrated with PLC) does this support?
      - What environmental protections (sealed, washdown-rated, cleanroom-compatible) are offered?
      - What is the typical cycle time for pick-and-place operations at full payload?
      id: M0118010000
      name: Single Axis Robots
    - description: Single-axis screw-driven units integrate bearing support, motor coupling, and limit
        switches into modular assemblies ready for frame integration. Sealed or unsealed variants support
        diverse environments, with electric or manual actuation options and integrated position feedback.
      example_user_queries:
      - What travel ranges and force capabilities are available for integrated drive units?
      - Do you offer sealed or unsealed bearing support for different environmental conditions?
      - What motor types (stepper, servo, induction) and control interfaces are compatible?
      - What position feedback options (micro-switch, encoder, proximity sensor) can be integrated?
      - What is the installation footprint and mounting pattern for frame integration?
      - Can units be stacked vertically or horizontally for multi-axis positioning systems?
      id: M0118030000
      name: Single Axis Units (Screw Driven)
    - description: Belt-driven actuators and accessories deliver smooth, low-backlash linear motion with
        high speed capability and compact profile. Timing belt and pulley systems reduce cost compared
        to screw drives while maintaining accuracy sufficient for material handling and light assembly
        applications.
      example_user_queries:
      - What are the travel range, speed, and force specifications for belt-driven actuators?
      - Do you offer timing belt, serpentine, or V-belt drive configurations?
      - What backlash and repeatability can belt-driven actuators achieve?
      - What tensioning and alignment accessories ensure belt system durability?
      - Can belt actuators be combined with stepper or servo motors for position control?
      - What are the environmental limits (temperature, dust, moisture) for belt drive systems?
      id: M0118070000
      name: Belt Actuators & Accessories
    - description: Rod-style linear actuators provide pneumatic or electric actuation in compact envelope
        with rod-end and base-mount options. Ideal for space-constrained automation, these units deliver
        straightforward push-pull motion with integrated position sensing and end-of-stroke cushioning.
      example_user_queries:
      - What stroke lengths and bore diameters are available for rod-style actuators?
      - What are the push and pull force ratings across different pneumatic/electric options?
      - Do you offer adjustable or cushioned end-of-stroke configurations?
      - What position feedback options (proximity sensor, limit switch, LVDT) integrate with control systems?
      - What mounting styles (rod-end clevis, base-mount, threaded) are standard?
      - Can rod actuators be cycled at different speeds or dwell times within a single application?
      id: M0118100000
      name: Rod Style Actuators
    - description: Power cylinders and jacks deliver high-force hydraulic or pneumatic actuation for heavy-load
        lifting, pressing, and positioning in manufacturing and assembly machinery. Single-acting and
        double-acting configurations support diverse duty cycles with integral or external cushioning.
      example_user_queries:
      - What are the bore sizes, stroke lengths, and working pressure ratings?
      - Do you offer single-acting, double-acting, or telescoping cylinder designs?
      - What are the pull and push force specifications at different operating pressures?
      - Do you provide adjustable or integral cushioning for controlled end-of-stroke deceleration?
      - What mounting configurations (head-mounted, trunnion, base) are available?
      - Can cylinders be configured with integral counterbalance or pilot-operated check valves?
      id: M0118050000
      name: Power Cylinders & Jacks
    - description: Servo motors and drives enable precise speed control and positioning feedback for screw-driven
        linear actuators and rotary motion systems. Integrated encoder feedback and closed-loop control
        deliver sub-degree positioning accuracy and coordinated multi-axis motion.
      example_user_queries:
      - What servo motor power ratings (watts) and peak torque specifications are available?
      - What feedback resolution (counts per revolution) and control accuracy do encoders provide?
      - Do you offer integrated or external servo drive controllers with fieldbus connectivity?
      - What is the maximum speed and acceleration capability for different motor sizes?
      - Can servo systems support networked multi-axis synchronization and master-follower control?
      - What environmental protections (sealed connectors, washdown ratings) are available for servo motors?
      id: M0118040000
      name: Servo Motors/Drives
    description: Linear actuator components provide essential positioning, actuation, and motion control
      functionality across industrial automation and machinery systems. Portfolio spans belt-driven, screw-driven,
      and power-cylinder architectures supporting speed, force, and accuracy requirements from basic positioning
      to servo-controlled precision applications.
    example_user_queries:
    - What actuator types (belt, screw, cylinder) and travel ranges does your portfolio include?
    - What are the force, speed, and positioning accuracy specifications for different actuator styles?
    - Do you offer manual, pneumatic, or electric actuation options for integration flexibility?
    - What control interfaces (analog, pulse, fieldbus) are available for automation integration?
    - What duty cycles and environmental ratings suit different industrial applications?
    - Can actuators be configured in multi-axis or stacked arrangements for complex motion?
    id: M0118000000
    name: Linear Actuators
  - description: High-efficiency ball screws convert rotary motion to precise linear movement using recirculating
      ball circulation for minimal friction and backlash. Precision-ground threads and hardened steel
      construction support continuous duty across load classes from light positioning to heavy industrial
      applications.
    example_user_queries:
    - What pitch sizes, diameter ranges, and preload classes (C0-C5) are available?
    - What are the dynamic load rating and maximum speed specifications?
    - Do you offer precision ground (P1, P3, P5) or rolled screw variants?
    - What are the positioning repeatability and backlash specifications?
    - Can ball screws be supplied with integral or separate flange bearings?
    - What nut materials (steel, bronze, composite) and recirculation designs reduce friction?
    id: M0114000000
    name: Ball Screws
    variant_parameters:
      shaft_diameter_mm:
        description: Ball screw shaft nominal diameter in millimetres
        example: What shaft diameters are available?
        type: continuous
        unit: mm
      lead_mm:
        description: Lead (linear travel per revolution) in millimetres
        example: What lead options balance speed and thrust force?
        type: enum
        values:
        - '1'
        - '2'
        - '4'
        - '5'
        - '10'
        - '20'
        - '25'
        - '40'
      precision_grade:
        description: Accuracy class per ISO 3408 (C0 = highest)
        example: What precision grade is needed for my positioning repeatability?
        type: enum
        values:
        - C0
        - C1
        - C2
        - C3
        - C5
        - C7
        - C10
        - Rolled
      nut_type:
        description: Nut recirculation and mounting style
        example: Should I use a single-nut or double-nut (zero-backlash) assembly?
        type: enum
        values:
        - Single-Nut
        - Double-Nut
        - Flange-Single-Nut
        - Flange-Double-Nut
        - Mini-Nut
  - children:
    - description: Pre-assembled guide blocks ready for frame integration.
      id: M0119010000
      name: Linear Slide Assemblies
    - description: Complete linear motion units with integrated screw drive and limit switches.
      id: M0119020000
      name: Linear Stroke Units (Integrated Actuators)
    - description: Complete linear motion systems in pre-tested assemblies.
      id: M0119030000
      name: Precision Linear Packs
    - description: Configurable linear platforms supporting multiple axes.
      id: M0119040000
      name: Modular Linear Systems
    description: 'Pre-assembled and pre-configured linear motion solutions combining guides,

      drives, and actuators into integrated packages ready for frame integration.

      Includes slide assemblies, stroke units, and precision linear packs optimized

      for specific application classes.'
    example_user_queries:
    - What travel ranges and payload capacities are available for linear slide assemblies?
    - Do you offer pre-configured linear stroke units with integrated actuators?
    - What precision linear packs include guides, blocks, and drive systems?
    - Are sealed or cleanroom-compatible linear assemblies available?
    id: M0119000000
    name: Linear Motion Systems & Assemblies
    variant_parameters:
      sealing_type:
        description: Environmental protection level
        example: Do you offer sealed linear systems?
        type: enum
        values:
        - None
        - Sealed
        - Full-Sealed
        - Cleanroom-Compatible
      speed_class:
        description: Optimized speed range
        example: Which systems support high-speed operation?
        type: enum
        values:
        - Low-Speed
        - Medium-Speed
        - High-Speed
  - children:
    - description: Lead screw shafts engineered in Acme or trapezoidal profiles deliver cost-effective
        power transmission for linear automation with inherent self-locking and load-holding capability.
        Available in steel, stainless, or hardened variants supporting standard and custom pitch sizes.
      example_user_queries:
      - What thread profiles (Acme, trapezoidal, metric ISO) and pitch options are available?
      - What diameter ranges and maximum lengths can standard lead screws accommodate?
      - Do you offer steel, stainless steel, or heat-treated hardened screw options?
      - What are the self-locking characteristics and minimum load requirements?
      - Can lead screws be custom-threaded to non-standard pitch specifications?
      - What surface finishes and end treatments (threaded ends, flanged) are available?
      id: M0115010000
      name: Lead Screw Shafts
    - description: Lead screw clamp plates provide rigid axial positioning and load retention on lead
        screw shafts, securing nuts and preventing rotation during operation. Precision-machined designs
        ensure repeatable positioning and minimize vibration in reciprocating motion systems.
      example_user_queries:
      - What bore diameters and thickness options are available for different screw sizes?
      - What clamping force can clamp plates provide without deforming lead screws?
      - Do you offer fixed or adjustable clamp designs for different mounting scenarios?
      - What surface finishes and materials (steel, stainless, bronze) are available?
      - Can clamp plates accommodate both forward and reverse rotation clamping?
      - What is the installation procedure for secure, vibration-free mounting?
      id: M0115070000
      name: Lead Screw Clamp Plates
    - description: Lead screw nuts convert rotary input to linear output with self-locking characteristics
        inherent to Acme and trapezoidal profiles. Available in bronze, composite, and plastic materials
        with single or dual-nut configurations for minimum backlash positioning.
      example_user_queries:
      - What bore diameters and pitch options (Acme, trapezoidal) match your lead screw shafts?
      - Do you offer single-nut or dual-nut preload configurations for zero-backlash operation?
      - What nut materials (bronze, composite, plastic, nylon) provide different wear characteristics?
      - What are the self-locking load ratings and minimum operating speeds?
      - Can nuts be supplied with integrated limit switches or position sensors?
      - What mounting styles (flange, block, stand-alone) suit different actuation arrangements?
      id: M0115050000
      name: Lead Screw Nuts
    - description: Lead screw position indicators provide visual or electronic feedback of linear position
        along screw travel, using mechanical or magnetic sensor technologies. Analog and digital output
        options enable integration with control systems for closed-loop positioning verification.
      example_user_queries:
      - What position range and resolution (1mm, 0.5mm, etc.) do position indicators provide?
      - Do you offer mechanical dial indicators, electronic LVDT, or magnetic sensor outputs?
      - What output types (analog voltage, switch signals, CANbus) are compatible with your controls?
      - How are indicators mounted and connected to moving lead screw nuts or carriages?
      - What is the repeatability and accuracy of position feedback across the entire travel range?
      - Can indicators be integrated with automatic position stops or limit switches?
      id: M0115030000
      name: Lead Screw Position Indicators
    - description: Lead screw support units integrate bearing support, shaft coupling, and alignment for
        lead screw-driven linear actuators. Modular housings accept standard lead screw shafts with thrust-bearing
        preload options for consistent load distribution and positioning accuracy.
      example_user_queries:
      - What bore diameters and bearing preload configurations are available?
      - Do you offer open or sealed bearing designs for different environmental conditions?
      - What are the maximum axial and radial load ratings for different support sizes?
      - What coupling and alignment options integrate with motor drive shafts?
      - Can support units be mounted horizontally or vertically without performance degradation?
      - What materials (steel, stainless cast iron) suit different environmental exposures?
      id: M0115060000
      name: Lead Screw Support Units
    - description: Slide screws deliver sliding contact linear motion without rolling elements, using
        cross-drilled or spiral-grooved shafts paired with specialized nuts. Cost-effective alternative
        to ball or lead screws, providing compact profiles and inherent damping in reciprocating motion
        applications.
      example_user_queries:
      - What shaft diameters and groove patterns (spiral, cross-drilled) are available?
      - What are the travel ranges and maximum continuous operating speeds?
      - Do you offer standard metric or custom pitch configurations for integration flexibility?
      - What nut materials and self-lubricating properties extend service life without maintenance?
      - What is the positioning repeatability and backlash compared to ball or lead screws?
      - Can slide screws be combined with position indicators or limit switch mounting?
      id: M0115040000
      name: Slide Screws
    description: Lead screws and slide screws provide cost-effective linear motion transmission with lower
      precision than ball screws, ideal for positioning applications with moderate speed and accuracy
      requirements. Acme and trapezoidal thread profiles deliver efficient power transmission with inherent
      self-locking properties.
    example_user_queries:
    - What thread profiles (Acme, trapezoidal, ISO metric) and pitch sizes are available?
    - What are the lead screw diameter ranges and maximum continuous speeds?
    - Do you offer steel, stainless, or hardened variants for different environments?
    - What nut materials (bronze, composite, plastic) and self-locking properties reduce backlash?
    - What positioning repeatability and backlash can I expect from lead screw systems?
    - Can lead screws be combined with rotating nuts or stationary shafts for different arrangements?
    id: M0115000000
    name: Lead Screws & Slide Screws
  - description: Rigid mounting pedestals and brackets support and align rotating shafts while distributing
      loads across frame structures in machinery systems. Precision-bored designs ensure concentric bearing
      alignment, reducing vibration and extending bearing service life across continuous-duty industrial
      applications.
    example_user_queries:
    - What bore diameters and depth options are available for standard bearing sizes?
    - Do you offer pillow blocks, flange mounts, or frame-integrated bearing supports?
    - What load ratings and shaft speed limits apply to different support configurations?
    - Can supports be supplied with sealed bearing options for wet or dusty environments?
    - What alignment tolerances ensure <0.05mm radial runout on supported shafts?
    - Do you offer supports with integral lubrication ports or sealed bearing cartridges?
    id: M0102000000
    name: Shaft Supports
    variant_parameters:
      bore_diameter_mm:
        description: Shaft bore diameter in millimetres
        example: What bore sizes are available to match my shaft diameter?
        type: continuous
        unit: mm
      mount_type:
        description: Support body mounting style
        example: Do you offer pillow block, flange, or frame-integrated shaft supports?
        type: enum
        values:
        - Open-Type
        - Closed-Type
        - Pillow-Block
        - Flange-Mount
        - End-Support
      material:
        description: Housing material
        example: Are aluminum or cast-iron variants available?
        type: enum
        values:
        - Steel
        - Cast-Iron
        - Aluminum
        - Stainless-Steel
  - description: Quick-lock and set-screw shaft collars provide simple, tool-free axial positioning and
      load retention on rotating or stationary shafts. Clamping and conical designs accommodate metric
      and inch shaft diameters with repeatable positioning and vibration resistance.
    example_user_queries:
    - What shaft diameters (metric and inch) do your collar sizes accommodate?
    - Do you offer quick-lock (one-screw), set-screw, or clamping collar designs?
